# Alat diagnosis, BUKAN bagian tema. Pasang sebagai drop-in systemd plymouth untuk
# melihat kenapa plymouth jatuh ke mode teks saat shutdown. Hapus drop-in untuk kembali normal.
[Service]
ExecStart=
ExecStart=/usr/sbin/plymouthd --mode=shutdown --attach-to-session --debug --debug-file=/var/log/plymouth-shutdown-debug.log
TimeoutStartSec=15
